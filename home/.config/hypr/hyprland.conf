# Load desktop sections in a deterministic order.
source = ~/.config/hypr/conf.d/00-session.conf
source = ~/.config/hypr/conf.d/10-input.conf
source = ~/.config/hypr/conf.d/20-appearance.conf
source = ~/.config/hypr/conf.d/30-animations.conf
source = ~/.config/hypr/conf.d/40-rules.conf
source = ~/.config/hypr/conf.d/50-keybindings.conf
source = ~/.config/hypr/conf.d/60-misc.conf

# Generated theme first; machine-local preferences have final precedence.
source = ~/.config/hypr/hyprlazy.conf
source = ~/.config/hypr/local.conf
