# HyprLazy managed Hyprland integration.
# Keep this include near the end of hyprland.conf so the active Pywal palette
# wins over older static border declarations without replacing user dotfiles.
source = ~/.config/hypr/hyprlazy-colors.conf

# Notification surface motion. Direction comes from Dunst's top anchor.
layerrule = animation slide, match:namespace = ^dunst$
layerrule = animation slide, match:namespace = ^notifications$

# Match normal Hyprland window borders to the shell's Pywal color11.
general {
    col.active_border = $ags_color11
    col.inactive_border = $ags_color11_dim
}
