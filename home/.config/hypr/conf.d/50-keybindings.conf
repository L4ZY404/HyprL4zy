$mainMod = SUPER

# System
bind = $mainMod, RETURN, exec, ~/.config/ags/scripts/open-app.sh terminal
bind = $mainMod, Q, killactive
bind = $mainMod, C, fullscreen
bind = $mainMod, F, togglefloating
bind = $mainMod, J, layoutmsg, togglesplit

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod SHIFT, right, resizeactive, 100 0
bind = $mainMod SHIFT, left, resizeactive, -100 0
bind = $mainMod SHIFT, up, resizeactive, 0 -100
bind = $mainMod SHIFT, down, resizeactive, 0 100

# powermenu
bind = $mainMod, E, exec, ~/.config/ags/scripts/quick-launcher.sh 

# Custom launch apps
bind = $mainMod SHIFT, F, exec, ~/.config/ags/scripts/open-app.sh browser
bind = $mainMod, SPACE, exec, ~/.config/ags/scripts/quick-launcher.sh
bind = $mainMod, M, exec, ~/.config/ags/scripts/open-app.sh music

# Theme scripts #
bind = $mainMod, W, exec, ~/.config/ags/scripts/theme.sh
bind = $mainMod, grave, exec, ~/.config/ags/scripts/shell-center.sh
bind = $mainMod, P, exec, ~/.config/ags/scripts/power-menu.sh
bind = $mainMod, B, exec, ~/.config/ags/toggle.sh
bind = $mainMod SHIFT, B, exec, ~/.config/ags/scripts/bar-settings.sh toggle
bind = $mainMod, R, exec, ~/.config/ags/launch.sh --restart
bind = $mainMod, H, exec, ~/.config/ags/scripts/shortcuts.sh toggle

# System control extras
#screenshot
bind = $mainMod, S, exec, ~/.config/ags/scripts/screenshot.sh
bind = $mainMod SHIFT, S, exec, ~/.config/ags/scripts/screenshot.sh --sel
bind = $mainMod CTRL, S, exec, ~/.config/ags/scripts/screenshot.sh --in10
# Audio
binde = , XF86AudioRaiseVolume, exec, ~/.config/ags/scripts/system/volume.sh --inc 
binde = , XF86AudioLowerVolume, exec, ~/.config/ags/scripts/system/volume.sh --dec
bind = , XF86AudioMute, exec, ~/.config/ags/scripts/system/volume.sh --toggle
# Brightness
binde = , XF86MonBrightnessUp, exec, ~/.config/ags/scripts/system/brightness.sh up
binde = , XF86MonBrightnessDown, exec, ~/.config/ags/scripts/system/brightness.sh down
# Player
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

