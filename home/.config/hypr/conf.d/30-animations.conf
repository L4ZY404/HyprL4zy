animations {
    enabled = true

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1

    animation = windows, 1, 4.8, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 94%
    animation = windowsOut, 1, 1.5, linear, popin 94%
    animation = windowsMove, 1, 3.2, easeOutQuint

    animation = fade, 1, 3.0, quick
    animation = fadeIn, 1, 1.7, almostLinear
    animation = fadeOut, 1, 1.45, almostLinear

    # Layer timing is tuned for notification surfaces: a decisive slide-in and
    # a slightly faster exit, without overshoot. AGS surfaces that own their
    # animation are excluded with no_anim rules below.
    animation = layers, 1, 4.2, easeOutQuint
    animation = layersIn, 1, 3.0, easeOutQuint, fade
    animation = layersOut, 1, 2.25, easeInOutCubic, fade
    animation = fadeLayersIn, 1, 2.4, almostLinear
    animation = fadeLayersOut, 1, 2.0, almostLinear

    animation = border, 1, 5.4, easeOutQuint
    animation = borderangle, 1, 5.4, easeOutQuint

    animation = workspaces, 1, 2.2, easeInOutCubic, slidefade 18%
    animation = workspacesIn, 1, 2.0, easeOutQuint, slidefade 18%
    animation = workspacesOut, 1, 1.8, easeInOutCubic, slidefade 18%
}

