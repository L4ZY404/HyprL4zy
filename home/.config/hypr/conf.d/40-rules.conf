dwindle {
    preserve_split = true
}

#gestures {
#    workspace_swipe = false
#}

# ----------------------------------------------------- 
# Window rules
# ----------------------------------------------------- 
# HyprLazy owns its own morph/reveal animation. Disable compositor-side layer
# animation so the Cairo geometry and GTK sheet stay synchronized.
layerrule = no_anim on, match:namespace = ^ags-vertical-bar-.*
layerrule = no_anim on, match:namespace = ^ags-studio-.*
layerrule = no_anim on, match:namespace = ^ags-notifications-.*
# Dunst popup motion: Hyprland layer animations accept the style "slide".
# The top-anchored notification surface determines the downward direction.
layerrule = animation slide, match:namespace = ^(notifications|dunst)$
layerrule = no_anim on, match:namespace = ^ags-screen-frame-.*
#windowrule = float,^(pavucontrol)$
#windowrule = float,^(blueman-manager)$


